# model_config.yaml - 端点池 + LLM 路由配置
# synth-loop v0.5

endpoints:
  main_gateway:
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    description: "DeepSeek 主端点"
  backup_gateway:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key_env: "GLM_API_KEY"
    description: "GLM 备用端点"
  local_model:
    base_url: "http://localhost:11434/v1"
    api_key_env: ""
    description: "本地模型兜底 (Ollama)"
  aggregation_gateway:
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    description: "聚合/分析专用端点"

llm_routing:
  chat:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:1.5b"
  prompt_chat:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4.7-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:7b"
  task_chain:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4.7-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:7b"
  analysis:
    primary:
      endpoint: "aggregation_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:1.5b"

# Anthropic → OpenAI 模型映射（v0.5-hotfix-2）
# POST /v1/messages 入口的 Anthropic 模型名映射到下游 OpenAI 模型
anthropic_model_map:
  default: "deepseek-v4-flash"
  models:
    "claude-3-haiku-20240307":   "deepseek-v4-flash"
    "claude-3-5-sonnet-20241022": "deepseek-v4-flash"
    "claude-3-opus-20240229":     "deepseek-v4-flash"
    "claude-3-5-haiku-20241022":  "deepseek-v4-flash"
