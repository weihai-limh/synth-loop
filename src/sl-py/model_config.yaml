      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4.7-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:7b"
  code_review:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4.7-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:7b"
  creative_writing:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:1.5b"
  data_analysis:
    primary:
      endpoint: "aggregation_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:1.5b"
  design_generation:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:1.5b"
  translation:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:1.5b"

# _a P3: 多 LLM 网关注册表（独立配置面，enabled=false 默认零影响）
llm_gateway:
  enabled: false
  gateways:
    msllm:
      url: "http://localhost:17321/v1"
      api_key_env: ""
      kind: "aggregation"
      rank: 1
    vendor-x:
      url: "https://gw.x.com/v1"
      api_key_env: "VENDOR_X_KEY"
      kind: "aggregation"
      rank: 2

# Anthropic → OpenAI 模型映射（v0.5-hotfix-2）
# POST /v1/messages 入口的 Anthropic 模型名映射到下游 OpenAI 模型
anthropic_model_map:
  default: "deepseek-v4-flash"
  models:
    "claude-3-haiku-20240307":   "deepseek-v4-flash"
    "claude-3-5-sonnet-20241022": "deepseek-v4-flash"
    "claude-3-opus-20240229":     "deepseek-v4-flash"
    "claude-3-5-haiku-20241022":  "deepseek-v4-flash"
