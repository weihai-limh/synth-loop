# model_config.yaml - 端点池 + LLM 路由配置
# synth-loop v0.5

endpoints:
  main_gateway:
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    description: "DeepSeek 主端点"
  backup_gateway:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key_env: "GLM_API_KEY"
    description: "GLM 备用端点"
  local_model:
    base_url: "http://localhost:11434/v1"
    api_key_env: ""
    description: "本地模型兜底 (Ollama)"
  aggregation_gateway:
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    description: "聚合/分析专用端点"

llm_routing:
  chat:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:1.5b"
  prompt_chat:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4.7-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:7b"
  task_chain:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4.7-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:7b"
  analysis:
    primary:
      endpoint: "aggregation_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:1.5b"
  # _a P3（3.9/3.10）：规划用强模型、摘要用便宜模型
  planning:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4.7-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:7b"
  summarize:
    primary:
      endpoint: "main_gateway"
      model: "deepseek-v4-flash"
    fallback:
      endpoint: "backup_gateway"
      model: "GLM-4-Flash"
    degradation:
      endpoint: "local_model"
      model: "qwen2.5:1.5b"

# v0_1_2_d (B3): logic_category 细分路由（key ⊆ complexity_rules.yaml subtypes[].name）
# 结构同 llm_routing 下 service 扁平 dict；命中时按 logic_category 直查，未命中回落 service 默认。
